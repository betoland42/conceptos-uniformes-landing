<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1900" viewBox="0 0 1200 1900" role="img" aria-labelledby="title desc">
  <title id="title">Prototipo de baja fidelidad - Conceptos Uniformes</title>
  <desc id="desc">Planeación vertical de la landing con header, jumbotron, catálogo, ventajas, proceso, nosotros, registro y footer.</desc>
  <rect width="1200" height="1900" fill="#f4f4f4"/>
